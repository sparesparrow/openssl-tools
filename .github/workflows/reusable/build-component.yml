# Reusable workflow for building OpenSSL components
name: Build Component (Reusable)

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
        description: 'Component name (e.g., openssl, openssl-fips, openssl-quic)'
      platform:
        required: true
        type: string
        description: 'Platform identifier (e.g., linux-gcc11, windows-msvc2022)'
      build-type:
        required: false
        type: string
        default: 'Release'
        description: 'Build type (Debug, Release, RelWithDebInfo)'
      fips-enabled:
        required: false
        type: boolean
        default: false
        description: 'Enable FIPS mode'
      upload-artifacts:
        required: false
        type: boolean
        default: true
        description: 'Upload build artifacts'
    secrets:
      CONAN_LOGIN_USERNAME:
        required: false
      CONAN_PASSWORD:
        required: false
      ARTIFACTORY_API_KEY:
        required: false

env:
  CONAN_USER_HOME: ${{ github.workspace }}/.conan2
  CONAN_COLOR_DISPLAY: 1
  CLICOLOR_FORCE: 1
  CLICOLOR: 1

jobs:
  build:
    name: Build ${{ inputs.component }} (${{ matrix.platform-config.platform }})
    runs-on: ${{ matrix.platform-config.os }}
    strategy:
      matrix:
        platform-config:
          - platform: linux-gcc11
            os: ubuntu-22.04
            include: ${{ inputs.platform == 'linux-gcc11' || inputs.platform == 'all' }}
          - platform: linux-clang15
            os: ubuntu-22.04
            include: ${{ inputs.platform == 'linux-clang15' || inputs.platform == 'all' }}
          - platform: windows-msvc2022
            os: windows-2022
            include: ${{ inputs.platform == 'windows-msvc2022' || inputs.platform == 'all' }}
          - platform: macos-arm64
            os: macos-14
            include: ${{ inputs.platform == 'macos-arm64' || inputs.platform == 'all' }}
        exclude:
          - platform-config: ${{ !matrix.platform-config.include }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Conan Environment
        uses: ./.github/actions/setup-conan

      - name: Setup Conan Profiles
        run: |
          # Create platform-specific profiles if they don't exist
          PROFILE_PATH="conan-profiles/${{ matrix.platform-config.platform }}.profile"
          if [ ! -f "$PROFILE_PATH" ]; then
            echo "Creating profile: $PROFILE_PATH"
            conan profile new ${{ matrix.platform-config.platform }} --detect
            conan profile update settings.os=${{ matrix.platform-config.os }} ${{ matrix.platform-config.platform }}
            conan profile update settings.arch=x86_64 ${{ matrix.platform-config.platform }}
          fi

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_USER_HOME }}
          key: conan-${{ runner.os }}-${{ matrix.platform-config.platform }}-${{ inputs.component }}-${{ hashFiles('conanfile.py', 'conan-profiles/*.profile') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.platform-config.platform }}-${{ inputs.component }}-
            conan-${{ runner.os }}-${{ matrix.platform-config.platform }}-
            conan-${{ runner.os }}-
            
      - name: Configure Conan remotes
        if: secrets.CONAN_LOGIN_USERNAME != ''
        run: |
          conan remote add artifactory ${{ secrets.ARTIFACTORY_URL || 'https://artifactory.example.com/artifactory/api/conan/conan' }}
          conan remote login -p ${{ secrets.CONAN_PASSWORD }} artifactory ${{ secrets.CONAN_LOGIN_USERNAME }}
          
      - name: Build component
        run: |
          cd ${{ inputs.component }}
          conan create . --profile=${{ matrix.platform-config.platform }} \
            -s build_type=${{ inputs.build-type }} \
            -o fips=${{ inputs.fips-enabled }} \
            --build=missing
            
      - name: Test component
        run: |
          cd ${{ inputs.component }}
          conan test test_package . --profile=${{ matrix.platform-config.platform }} \
            -s build_type=${{ inputs.build-type }} \
            -o fips=${{ inputs.fips-enabled }}
            
      - name: Upload build artifacts
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.component }}-${{ matrix.platform-config.platform }}-${{ inputs.build-type }}
          path: |
            ${{ env.CONAN_USER_HOME }}/p/*/p/
            build/
          retention-days: 30