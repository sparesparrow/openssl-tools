name: Security Scan (Reusable)

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
        description: 'Component name to scan'
      scan-type:
        required: false
        type: string
        default: 'full'
        description: 'Scan type (full, quick)'
      generate-sbom:
        required: false
        type: boolean
        default: true
        description: 'Generate SBOM'

jobs:
  security-scan:
    name: Security Scan ${{ inputs.component }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Conan Environment
        uses: ./.github/actions/setup-conan

      - name: Run Security Scan Suite
        uses: ./.github/actions/security-scan
        with:
          scan-target: '.'
          severity: ${{ inputs.scan-type == 'full' && 'CRITICAL,HIGH' || 'CRITICAL' }}
          fail-on-critical: true
          enable-fips-check: ${{ inputs.scan-type == 'full' }}