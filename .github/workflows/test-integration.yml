name: Test Integration
on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-trigger]

jobs:
  test-bootstrap:
    name: Test Bootstrap Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test openssl-conan-init.py
        run: python openssl-conan-init.py

  test-build:
    needs: test-bootstrap
    uses: ./.github/workflows/reusable/build-component.yml
    with:
      component: 'openssl-tools'
      platform: 'linux-gcc11'
      build-type: 'Release'
      fips-enabled: false

  test-security:
    needs: test-bootstrap
    uses: ./.github/workflows/reusable/security-scan.yml
    with:
      component: 'openssl-tools'
      scan-type: 'full'
      generate-sbom: true