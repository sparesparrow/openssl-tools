name: 'Publish to Cloudsmith'
description: 'Publish Conan packages to Cloudsmith repository'
inputs:
  package-reference:
    description: 'Package reference (e.g., openssl-tools/1.2.7)'
    required: true
  repository:
    description: 'Cloudsmith repository name'
    required: true
  owner:
    description: 'Cloudsmith owner/organization'
    required: true
  package-format:
    description: 'Package format (conan, etc.)'
    required: false
    default: 'conan'
runs:
  using: 'composite'
  steps:
    - name: Install Cloudsmith CLI
      shell: bash
      run: pip install cloudsmith-cli

    - name: Publish to Cloudsmith
      shell: bash
      env:
        CLOUDSMITH_API_KEY: ${{ env.CLOUDSMITH_API_KEY }}
      run: |
        # Authenticate and publish
        cloudsmith push ${{ inputs.package-format }} \
          ${{ inputs.owner }}/${{ inputs.repository }} \
          ${{ inputs.package-reference }} \
          --api-key $CLOUDSMITH_API_KEY